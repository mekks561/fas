[package]
name = "physics-kernel"
version = "0.1.0"
authors = ["Fighter Game Team"]
edition = "2021"
description = "High-performance physics micro-kernel for v2.7 Deep Space Awakening"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.92"
flatbuffers = "25.9.23"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them to `console.error`. This is great for development, but can
# be large.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
